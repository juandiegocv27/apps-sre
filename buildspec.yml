version: 0.2

env:
  variables:
    # Definir en CodeBuild project:
    # AWS_REGION
    # SERVICE_NAME              (ej: catalog)
    # ECR_REPOSITORY            (<acct>.dkr.ecr.<region>.amazonaws.com/shopstack-catalog)
    # BUILD_CONTEXT             (ej: services/catalog)
    # CLUSTER_GITOPS_REPO       (https://github.com/<you>/cluster-gitops.git)
    # GITOPS_KUSTOMIZE_PATH     (ej: apps/catalog/overlays/dev/kustomization.yaml)
  git-credential-helper: yes

phases:
  install:
    commands:
      - set -euo pipefail
      - docker --version
      - aws --version
      - git --version
      - gh --version || echo "gh CLI not found (PR auto-create optional)"

  pre_build:
    commands:
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - echo "IMAGE_TAG=$IMAGE_TAG"
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region "${AWS_REGION}" |
        docker login --username AWS --password-stdin "$(echo ${ECR_REPOSITORY} | cut -d'/' -f1)"

  build:
    commands:
      - echo "Building image..."
      - docker build -t "${ECR_REPOSITORY}:${IMAGE_TAG}" -t "${ECR_REPOSITORY}:latest" "${BUILD_CONTEXT}"

  post_build:
    commands:
      - echo "Pushing image..."
      - docker push "${ECR_REPOSITORY}:${IMAGE_TAG}"
      - docker push "${ECR_REPOSITORY}:latest"

      - echo "Cloning cluster-gitops..."
      - cd /tmp
      - rm -rf cluster-gitops
      - git clone "${CLUSTER_GITOPS_REPO}" cluster-gitops
      - cd cluster-gitops

      - SHORT_TAG=$(echo "${IMAGE_TAG}" | cut -c1-7)
      - BRANCH_NAME="chore/${SERVICE_NAME}-image-${SHORT_TAG}"
      - git checkout -b "${BRANCH_NAME}"

      - echo "Updating Kustomize image tag..."
      - sed -i "s/^\(\s*newTag:\s*\).*/\1\"${IMAGE_TAG}\"/" "${GITOPS_KUSTOMIZE_PATH}"

      - git add "${GITOPS_KUSTOMIZE_PATH}"
      - git commit -m "chore: bump ${SERVICE_NAME} image to ${SHORT_TAG}"
      - git push origin "${BRANCH_NAME}"

      - |
        if command -v gh >/dev/null 2>&1; then
          echo "Creating PR..."
          gh auth setup-git
          gh pr create \
            --base main \
            --head "${BRANCH_NAME}" \
            --title "chore: bump ${SERVICE_NAME} image to ${SHORT_TAG}" \
            --body "Auto-generated by CodeBuild. Updates ${SERVICE_NAME} image tag to \`${IMAGE_TAG}\`."
        else
          echo "gh not installed; PR not created automatically."
        fi
