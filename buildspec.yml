version: 0.2

env:
  git-credential-helper: yes
  variables:
    # These variables are defined in the CodeBuild project
    # AWS_REGION=us-east-1
    # SERVICE_NAME=catalog
    # ECR_REPOSITORY=770132776547.dkr.ecr.us-east-1.amazonaws.com/shopstack-catalog
    # BUILD_CONTEXT=services/catalog
    # CLUSTER_GITOPS_REPO=https://github.com/juandiegocv27/cluster-gitops.git
    # GITOPS_KUSTOMIZE_PATH=apps/catalog/overlays/dev/kustomization.yaml
    #
    # GITHUB_TOKEN is retrieved from AWS Secrets Manager

phases:
  install:
    commands:
      - set -euo pipefail
      - echo "== Install phase =="
      - docker --version
      - aws --version
      - git --version

  pre_build:
    commands:
      - echo "== Pre-build phase =="
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION}
      - echo "Image tag: ${IMAGE_TAG}"

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "${AWS_REGION}" |
        docker login --username AWS --password-stdin "$(echo ${ECR_REPOSITORY} | cut -d'/' -f1)"

  build:
    commands:
      - echo "== Build phase =="
      - echo "Building Docker image from ${BUILD_CONTEXT}"
      - docker build \
          -t "${ECR_REPOSITORY}:${IMAGE_TAG}" \
          -t "${ECR_REPOSITORY}:latest" \
          "${BUILD_CONTEXT}"

  post_build:
    commands:
      - echo "== Post-build phase =="

      - echo "Pushing images to ECR..."
      - docker push "${ECR_REPOSITORY}:${IMAGE_TAG}"
      - docker push "${ECR_REPOSITORY}:latest"

      - echo "Configuring GitHub authentication..."
      - git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

      - echo "Cloning cluster-gitops repository..."
      - cd /tmp
      - rm -rf cluster-gitops
      - git clone "${CLUSTER_GITOPS_REPO}" cluster-gitops
      - cd cluster-gitops

      - SHORT_TAG=$(echo "${IMAGE_TAG}" | cut -c1-7)
      - BRANCH_NAME="chore/${SERVICE_NAME}-image-${SHORT_TAG}"
      - echo "Creating branch ${BRANCH_NAME}"
      - git checkout -b "${BRANCH_NAME}"

      - echo "Updating Kustomize image tag..."
      - sed -i "s/^\(\s*newTag:\s*\).*/\1\"${IMAGE_TAG}\"/" "${GITOPS_KUSTOMIZE_PATH}"

      - echo "Git diff:"
      - git diff

      - git add "${GITOPS_KUSTOMIZE_PATH}"
      - git commit -m "chore: bump ${SERVICE_NAME} image to ${SHORT_TAG}"
      - git push origin "${BRANCH_NAME}"

      - echo "Build completed successfully."
